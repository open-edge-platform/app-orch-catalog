---
specSchema: "Application"
schemaVersion: "0.1"
$schema: "https://schema.intel.com/catalog.orchestrator/0.1/schema"

name: one
version: 0.1.1
description: "application number one"

helmRegistry: "one"
chartName: "one"
chartVersion: "19.4.3"

profiles:
  - name: "default"
    valuesFileName: "values-one-default.yaml"
    parameterTemplates:
      - name: "service.type"
        displayName: "service type"
        type: string
        default: "ClusterIP"
  - name: "a"
    valuesFileName: "values-one-a.yaml"
    parameterTemplates:
      - name: "service.type"
        displayName: "service type"
        type: string
        default: "ClusterIP"
  - name: "b"
    valuesFileName: "values-one-b.yaml"
    parameterTemplates:
      - name: "service.type"
        displayName: "service type"
        type: string
        default: "ClusterIP"

ignoredResources:
  - name: "wordpress-vwc"
    kind: "ValidatingWebhookConfiguration"
  - name: "wordpress-mwc"
    kind: "MutatingWebhookConfiguration"
  - name: "wordpress-crd"
    kind: "CustomResourceDefinition"
  - name: "wordpress-mysql"
    kind: "Secret"
    namespace: "ns1"
  - name: "wordpress-mysql"
    kind: "Secret"
    namespace: "ns2"
  - name: "wordpress-mysql"
    kind: "Deployment"
    namespace: "ns1"
