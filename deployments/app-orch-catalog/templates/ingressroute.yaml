---
# Traefik IngressRoute for App Orch Catalog API routing.
# Routes new-style multi-tenant paths directly to the catalog REST proxy,
# bypassing the nexus-api-gateway.
#
# New-style paths routed here (project name extracted by service middleware):
#   /v1/projects/{projectName}/catalog/...  -> catalog REST proxy
#
# Legacy paths (catalog.orchestrator.apis/v3/...) continue to be routed
# via the nexus-api-gateway for backward compatibility.
{{- if .Values.ingressRoute.enabled }}
apiVersion: {{ .Values.traefikApiGroup | default "traefik.io/v1alpha1" }}
kind: IngressRoute
metadata:
  name: {{ include "application-catalog.fullname" . }}-http
  namespace: orch-gateway
spec:
  entryPoints:
    - websecure
  routes:
    # Route for new-style multi-tenant catalog API paths.
    # ActiveProjectID is extracted from the URL path by the service middleware.
    - match: Host(`{{ required "A valid apiHostname entry required!" .Values.ingressRoute.apiHostname }}`) && PathRegexp(`^/v1/projects/[^/]+/catalog(/.*)?$`)
      kind: Rule
      priority: 50
      middlewares:
        - name: validate-jwt
          namespace: orch-gateway
        - name: secure-headers
          namespace: orch-gateway
      services:
        - name: {{ include "application-catalog.fullname" . }}-rest-proxy
          namespace: {{ .Release.Namespace }}
          port: {{ .Values.service.restProxy.port }}
          scheme: http
  tls:
    options:
      name: {{ required "A valid tlsOptionName entry required!" .Values.ingressRoute.tlsOptionName }}
      namespace: orch-gateway
    secretName: {{ required "A valid orchSecretName entry required!" .Values.ingressRoute.orchSecretName }}
{{- end }}
