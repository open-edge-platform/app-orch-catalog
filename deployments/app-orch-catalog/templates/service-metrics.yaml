{{- if .Values.catalogServer.metrics.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  labels:
    {{- include "application-catalog.labels" . | nindent 4 }}
  name: {{ include "application-catalog.fullname" . }}-metrics
spec:
  ports:
    - name: http-metrics
      port: {{ .Values.catalogServer.metrics.port }}
      protocol: TCP
      targetPort: http-metrics
  selector:
    {{- include "application-catalog.selectorLabels" . | nindent 4 }}
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  labels:
    {{- include "application-catalog.labels" . | nindent 4 }}
  name: {{ include "application-catalog.fullname" . }}
spec:
  endpoints:
  - port: http-metrics
    scheme: http
    path: /metrics
  namespaceSelector:
    matchNames:
    - {{ .Release.Namespace }}
  selector:
    matchExpressions:
    - key: prometheus.io/service-monitor
      operator: NotIn
      values:
      - "false"
    matchLabels:
      {{- include "application-catalog.labels" . | nindent 6 }}
{{- end }}
