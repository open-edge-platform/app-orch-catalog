---
{{ if or .Values.modifyResource.configmap .Values.modifyResource.secret }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "httpbin.fullname" . }}-role
rules:
  - apiGroups:
      - ""
    resources:
      - configmaps
    verbs:
      - get
      - patch
  - apiGroups:
      - ""
    resources:
      - secrets
    verbs:
      - get
      - delete
      - create
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "httpbin.fullname" . }}-role-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "httpbin.fullname" . }}-role
subjects:
  - kind: ServiceAccount
    name: {{ include "httpbin.serviceAccountName" . }}

{{- end }}